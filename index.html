<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор номеров</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f4;
      color: #000;
      transition: background-color 0.3s, color 0.3s;
    }

    body.dark-mode {
      background-color: #333;
      color: #f4f4f4;
    }

    .phone-number {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      background-color: #fff;
      color: #000;
      transition: background-color 0.3s;
    }

    body.dark-mode .phone-number {
      background-color: #444;
      color: #f4f4f4;
    }

    .phone-number.green {
      background-color: #d4edda;
      border-color: #c3e6cb;
    }

    .phone-number.dark-green {
      background-color: #155724;
      border-color: #1e7e34;
      color: white;
    }

    .phone-links a {
      margin-left: 10px;
      text-decoration: none;
    }

    body.dark-mode .phone-links a {
      color: #ffcc00;
    }

    .phone-links a:hover {
      text-decoration: underline;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    #config-section {
      margin-bottom: 20px;
    }

    #example-number {
      margin-top: 10px;
      font-weight: bold;
    }

    .theme-switcher {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>Генератор номеров телефонов</h1>

  <div class="theme-switcher">
    <label for="theme-toggle">Светлая/Темная тема:</label>
    <input type="checkbox" id="theme-toggle">
  </div>

  <div id="config-section">
    <label for="country-code">Код страны:</label>
    <input type="text" id="country-code" value="+996">
    <label for="city-code">Код города:</label>
    <input type="text" id="city-code" placeholder="Введите код города">
    <label for="number-length">Длина номера:</label>
    <input type="number" id="number-length" min="7" max="10" value="7">
    <div id="example-number">Пример: +9961234567</div>
    <button id="start-btn">Начать</button>
  </div>

  <div id="numbers" style="display: none;"></div>
  <button id="generate-btn" style="display: none;">Сгенерировать ещё 100 номеров</button>

  <script>
    const generatedNumbers = new Set();
    let phoneIndex = 1;

    // Смена темы
    const themeToggle = document.getElementById('theme-toggle');
    themeToggle.addEventListener('change', () => {
      document.body.classList.toggle('dark-mode', themeToggle.checked);
    });

    function generateRandomNumber(length) {
      let number = '';
      for (let i = 0; i < length; i++) {
        number += Math.floor(Math.random() * 10);
      }
      return number;
    }

    function updateExampleNumber() {
      const countryCode = document.getElementById('country-code').value;
      const cityCode = document.getElementById('city-code').value;
      const numberLength = document.getElementById('number-length').value;
      const example = `${countryCode}${cityCode}${'X'.repeat(numberLength - cityCode.length)}`;
      document.getElementById('example-number').textContent = `Пример: ${example}`;
    }

    function generatePhoneNumbers() {
      const countryCode = document.getElementById('country-code').value;
      const cityCode = document.getElementById('city-code').value;
      const numberLength = document.getElementById('number-length').value;
      const numbersContainer = document.getElementById('numbers');

      for (let i = 0; i < 100; i++) {
        let phoneNumber;
        do {
          phoneNumber = cityCode + generateRandomNumber(numberLength - cityCode.length);
        } while (generatedNumbers.has(phoneNumber));

        generatedNumbers.add(phoneNumber);
        
        const phoneDiv = document.createElement('div');
        phoneDiv.className = 'phone-number';
        phoneDiv.innerHTML = `
          <span>${phoneIndex}. ${countryCode} ${phoneNumber}</span>
          <div class="phone-links">
            <a href="https://t.me/${countryCode}${phoneNumber}" target="_blank">
              <img src="https://free-png.ru/wp-content/uploads/2023/06/free-png.ru-30-370x370.png" alt="Телеграмм" width="50px" height="50px">
            </a>
            <a href="https://wa.me/${countryCode}${phoneNumber}" target="_blank">
              <img src="https://gas-kvas.com/grafic/uploads/posts/2024-01/gas-kvas-com-p-znachok-vatsap-dlya-vizitki-na-prozrachnom-11.png" alt="WhatsApp" width="50px" height="50px">
            </a>
            <button class="reset-color" style="margin-left: 10px;">Сбросить цвет</button>
          </div>
        `;

        let clickCount = 0;
        phoneDiv.addEventListener('click', () => {
          clickCount++;
          if (clickCount === 1) {
            phoneDiv.classList.add('green');
            phoneDiv.classList.remove('dark-green');
          } else if (clickCount === 2) {
            phoneDiv.classList.add('dark-green');
            phoneDiv.classList.remove('green');
            clickCount = 0; // Сбрасываем после второго клика
          }
        });

        // Обработчик для сброса цвета
        const resetBtn = phoneDiv.querySelector('.reset-color');
        resetBtn.addEventListener('click', (e) => {
          e.stopPropagation(); // Останавливаем всплытие события
          phoneDiv.classList.remove('green', 'dark-green');
        });

        numbersContainer.appendChild(phoneDiv);
        phoneIndex++;
      }
    }

    document.getElementById('number-length').addEventListener('input', updateExampleNumber);
    document.getElementById('country-code').addEventListener('input', updateExampleNumber);
    document.getElementById('city-code').addEventListener('input', updateExampleNumber);

    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('config-section').style.display = 'none';
      document.getElementById('numbers').style.display = 'block';
      document.getElementById('generate-btn').style.display = 'inline-block';
      generatePhoneNumbers();
    });

    document.getElementById('generate-btn').addEventListener('click', generatePhoneNumbers);
  </script>
</body>
</html>
