<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор номеров</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f4;
      color: #000;
      transition: background-color 0.3s, color 0.3s;
    }
    .dark-theme {
      background-color: #181818;
      color: #fff;
    }
    .phone-number {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.3s, border-color 0.3s;
    }
    .phone-number.green {
      background-color: #d4edda;
      border-color: #c3e6cb;
    }
    .phone-links a {
      margin-left: 10px;
      text-decoration: none;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }
    .dark-theme button {
      background-color: #333;
      color: #fff;
    }
    .dark-theme button:hover {
      background-color: #444;
    }
    #theme-toggle-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
    }
    .dark-theme #theme-toggle-btn {
      background-color: #444;
    }
  </style>
</head>
<body>
  <h1>Генератор номеров телефонов</h1>

  <div id="config-section">
    <label for="country-code">Код страны:</label>
    <input type="text" id="country-code" value="+996">
    <label for="city-code">Код города:</label>
    <input type="text" id="city-code" placeholder="Введите код города">
    <label for="number-length">Длина номера:</label>
    <input type="number" id="number-length" min="7" max="10" value="7">
    <button id="start-btn">Начать</button>
  </div>

  <div id="numbers" style="display: none;"></div>
  <button id="generate-btn" style="display: none;">Сгенерировать ещё 100 номеров</button>

  <button id="theme-toggle-btn" onclick="toggleTheme()">🌙</button>

  <script>
    const generatedNumbers = new Set();
    let phoneIndex = 1;

    function generateRandomNumber(length) {
      let number = '';
      for (let i = 0; i < length; i++) {
        number += Math.floor(Math.random() * 10);
      }
      return number;
    }

    function generatePhoneNumbers() {
      const countryCode = document.getElementById('country-code').value;
      const cityCode = document.getElementById('city-code').value;
      const numberLength = document.getElementById('number-length').value;
      const numbersContainer = document.getElementById('numbers');

      for (let i = 0; i < 100; i++) {
        let phoneNumber;
        do {
          phoneNumber = cityCode + generateRandomNumber(numberLength - cityCode.length);
        } while (generatedNumbers.has(phoneNumber));

        generatedNumbers.add(phoneNumber);
        
        const phoneDiv = document.createElement('div');
        phoneDiv.className = 'phone-number';
        phoneDiv.innerHTML = `
          <span>${phoneIndex}. ${countryCode} ${phoneNumber}</span>
          <div class="phone-links">
            <a href="#" onclick="openInNewTab('https://t.me/${countryCode}${phoneNumber}')">
              <img src="https://free-png.ru/wp-content/uploads/2023/06/free-png.ru-30-370x370.png" alt="Телеграмм" width="50px" height="50px">
            </a>
            <a href="#" onclick="openInNewTab('https://wa.me/${countryCode}${phoneNumber}')">
              <img src="https://gas-kvas.com/grafic/uploads/posts/2024-01/gas-kvas-com-p-znachok-vatsap-dlya-vizitki-na-prozrachnom-11.png" alt="WhatsApp" width="50px" height="50px">
            </a>
          </div>
        `;

        numbersContainer.appendChild(phoneDiv);
        phoneIndex++;
      }
    }

    // Открытие ссылки в новой вкладке
    function openInNewTab(url) {
      window.open(url, '_blank');
    }

    // Переключение между темами
    function toggleTheme() {
      document.body.classList.toggle('dark-theme');
      const themeButton = document.getElementById('theme-toggle-btn');
      if (document.body.classList.contains('dark-theme')) {
        themeButton.innerText = '🌞'; // Солнечный значок для светлой темы
      } else {
        themeButton.innerText = '🌙'; // Лунный значок для темной темы
      }
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('config-section').style.display = 'none';
      document.getElementById('numbers').style.display = 'block';
      document.getElementById('generate-btn').style.display = 'inline-block';
      generatePhoneNumbers();
    });

    document.getElementById('generate-btn').addEventListener('click', generatePhoneNumbers);
  </script>
</body>
</html>
